<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Pembelajaran - SMAN 8 Samarinda</title>

    <!-- External Resources -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- =========================================
         BAGIAN CSS (STYLE)
         ========================================= -->
    <style>
        /* --- 1. VARIABLES & RESET --- */
        :root {
            --bg-color: #ffffff;
            --primary: #3b82f6;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --text-dark: #1e293b;
            --text-grey: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.1), transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 60px;
        }

        /* --- 2. HEADER --- */
        .hero-card-wrapper {
            background: #eef6ff;
            background-image: 
                linear-gradient(to right, rgba(59, 130, 246, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.12) 1px, transparent 1px);
            background-size: 24px 24px;
            border: 2px solid #bfdbfe;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 10px;
            margin-top: 10px;
        }

        .header-section-inner {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.06);
            position: relative;
            overflow: hidden;
        }

        .header-section {
            text-align: center;
            margin-top: 20px;
        }

        .badge-float {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.1);
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .badge-float i {
            color: #f59e0b;
        }

        h2 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1.5px;
            line-height: 1.1;
            color: #1e3a8a;
        }

        h2 span {
            background: linear-gradient(120deg, #2563eb, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.35));
        }

        .typing-container {
            font-size: 1.1rem;
            color: var(--text-grey);
            font-weight: 500;
            display: inline-block;
            min-height: 1.5em;
            max-width: 100%;
            margin-bottom: 10px;
        }

        .typing-container::after {
            content: '|';
            color: var(--primary);
            font-weight: 700;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            vertical-align: baseline;
        }

        /* --- 3. FILTER BUTTONS --- */
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .filter-btn {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-grey);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            color: var(--primary);
            background: #fff;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        /* --- 4. VIDEO CARDS --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .video-card {
            background: #fff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.1);
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
        }

        .video-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, rgba(59, 130, 246, 0.05), transparent);
            transition: 0.4s;
            z-index: 0;
        }

        .video-card:hover::before {
            height: 100%;
        }

        .thumb-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 1;
            aspect-ratio: 16/9;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
            opacity: 0.9;
        }

        .video-card:hover .thumb-wrapper img {
            transform: scale(1.05);
            opacity: 1;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s;
        }

        .play-overlay i {
            color: #fff;
            font-size: 1.2rem;
            margin-left: 3px;
        }

        .video-card:hover .play-overlay {
            background: var(--primary);
            border-color: var(--primary);
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.3);
        }

        .badge-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .card-content {
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-grey);
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .level-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .text-green {
            color: #10b981;
        }

        .text-cyan {
            color: var(--cyan);
        }

        .text-pink {
            color: var(--pink);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(90deg, var(--text-dark), #334155);
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .video-card:hover .action-btn {
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        .action-btn span.arrow {
            display: inline-block;
            transition: 0.3s;
        }

        .video-card:hover .action-btn span.arrow {
            transform: translateX(5px);
        }

        /* --- 5. MODAL PLAYER --- */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            padding: 20px;
        }

        .video-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            transform: scale(0.9);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .video-modal.active .video-wrapper {
            transform: scale(1);
        }

        .close-video {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
            z-index: 1000000;
        }

        .close-video:hover {
            color: var(--pink);
            transform: rotate(90deg);
        }

        /* --- ANIMATIONS & MEDIA QUERY --- */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .hero-card-wrapper {
                padding: 16px;
                border-radius: 20px;
            }

            .header-section-inner {
                padding: 20px 14px;
                border-radius: 18px;
            }

            h2 {
                font-size: 1.5rem;
                letter-spacing: -0.5px;
            }

            .typing-container {
                font-size: 0.92rem;
            }

            .video-modal {
                padding: 10px;
            }

            .close-video {
                top: -50px;
                right: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         BAGIAN HTML (STRUKTUR)
         ========================================= -->
    <div class="container">

        <!-- Header -->
        <div class="hero-card-wrapper">
            <div class="header-section-inner">
                <div class="badge-float">
                    <i class="fas fa-play-circle"></i> Ruang Video
                </div>
                <h2>Video <span>Materi Pembelajaran</span></h2>
                <div class="typing-container" id="typewriterVideo"></div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="controls-container">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="Sistem Komputer">Sistem Komputer</button>
            <button class="filter-btn" data-filter="Interaksi">Interaksi</button>
            <button class="filter-btn" data-filter="OS & Driver">OS & Driver</button>
        </div>

        <!-- Video Grid Container -->
        <div class="video-grid" id="videoContainer">
            <!-- Konten akan di-render oleh JavaScript -->
        </div>

    </div>

    <!-- Video Modal Overlay -->
    <div class="video-modal" id="videoModal">
        <div class="video-wrapper">
            <div class="close-video" id="closeBtn">&times;</div>
            <iframe id="youtubeFrame" width="100%" height="100%" src="" title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>
        </div>
    </div>

    <!-- =========================================
         BAGIAN JAVASCRIPT (LOGIKA)
         ========================================= -->
    <script>
        /* --- 1. DATA VIDEO --- */
        const videos = [
            {
                id: 1,
                title: "Anatomi Komputer",
                category: "Sistem Komputer",
                level: "Mudah", levelColor: "text-green", dotColor: "#10b981",
                time: "15 Menit",
                desc: "Membedah anatomi komputer: Hardware, Software, dan Brainware secara lengkap.",
                youtubeId: "1WZaycH6awQ"
            },
            {
                id: 2,
                title: "Interaksi Manusia",
                category: "Interaksi",
                level: "Sedang", levelColor: "text-cyan", dotColor: "#06b6d4",
                time: "10 Menit",
                desc: "Bagaimana manusia 'berbicara' dengan mesin melalui Interface (GUI & CLI).",
                youtubeId: "FX-qIcq0BtI"
            },
            {
                id: 3,
                title: "Jaringan Internet",
                category: "Interaksi",
                level: "Sedang", levelColor: "text-cyan", dotColor: "#06b6d4",
                time: "12 Menit",
                desc: "Memahami konsep dasar jaringan komputer dan bagaimana data terkirim.",
                youtubeId: "YKxgEbx5Trw"
            },
            {
                id: 4,
                title: "Sistem Operasi",
                category: "OS & Driver",
                level: "Sulit", levelColor: "text-pink", dotColor: "#ec4899",
                time: "09 Menit",
                desc: "Jantung komputer yang mengatur segalanya, dari booting hingga shutdown.",
                youtubeId: "Klpmhv9ho3w"
            }
        ];

        /* --- 2. SELECTOR DOM --- */
        const container = document.getElementById('videoContainer');
        const buttons = document.querySelectorAll('.filter-btn');
        const textEl = document.getElementById('typewriterVideo');
        const modal = document.getElementById('videoModal');
        const iframe = document.getElementById('youtubeFrame');
        const closeBtn = document.getElementById('closeBtn');
        const videoWrapper = document.querySelector('.video-wrapper');

        /* --- 3. EFEK MENGETIK (Typewriter) --- */
        const text = "Tonton video interaktif untuk pemahaman lebih dalam...";
        let idx = 0;

        function typeWriter() {
            if (idx < text.length) {
                textEl.innerHTML += text.charAt(idx);
                idx++; setTimeout(typeWriter, 50);
            }
        }
        // Jalankan Typewriter
        typeWriter();

        /* --- 4. RENDER VIDEO KE HTML --- */
        function renderVideos(list) {
            if (list.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--text-grey); padding:40px;">Video tidak ditemukan.</div>';
                return;
            }

            // Generate HTML String
            container.innerHTML = list.map(item => `
                <div class="video-card" onclick="openVideo('${item.youtubeId}')">
                    <div class="thumb-wrapper">
                        <span class="badge-category">${item.category}</span>
                        <img src="https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg" alt="${item.title}">
                        <div class="play-overlay"><i class="fas fa-play"></i></div>
                    </div>
                    
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        
                        <div class="meta-info">
                            <span class="${item.levelColor}">
                                <span class="level-dot" style="background:${item.dotColor}"></span>${item.level}
                            </span>
                            <span style="color:var(--text-grey)"><i class="far fa-clock"></i> ${item.time}</span>
                        </div>

                        <button class="action-btn">
                            Tonton Video <span class="arrow">➔</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render awal (Semua video)
        renderVideos(videos);

        /* --- 5. LOGIKA FILTER BUTTON --- */
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Hapus class active dari semua tombol
                buttons.forEach(b => b.classList.remove('active'));
                // Tambah class active ke tombol yang diklik
                btn.classList.add('active');

                const cat = btn.dataset.filter;
                // Filter data
                renderVideos(cat === 'all' ? videos : videos.filter(v => v.category === cat));
            });
        });

        /* --- 6. LOGIKA MODAL VIDEO --- */

        // Fungsi Buka Video (Dipanggil via onclick di renderVideos)
        window.openVideo = function (id) {
            iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            modal.classList.add('active');

            // Fix posisi modal jika dibuka di HP
            if (window.innerWidth <= 600) {
                videoWrapper.style.transform = "scale(1) translateY(-20px)";
            }
        };

        // Fungsi Tutup Video
        function closeVideo() {
            modal.classList.remove('active');
            // Hapus src agar suara video berhenti
            setTimeout(() => { iframe.src = ""; }, 300);
            // Reset transform wrapper
            videoWrapper.style.transform = "";
        }

        // Event Listener: Klik tombol close
        closeBtn.addEventListener('click', closeVideo);

        // Event Listener: Klik area gelap (background) untuk menutup
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeVideo();
            }
        });

        // Mencegah penutupan jika yang diklik adalah wrapper video
        videoWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
        });

    </script>

</body>

</html>
