<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Pembelajaran - SMAN 8 Samarinda</title>

    <!-- External Resources -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- =========================================
         BAGIAN CSS (STYLE MANDIRI UNTUK GOOGLE SITES EMBED)
         ========================================= -->
    <style>
        /* --- 1. VARIABLES & RESET --- */
        :root {
            --bg-color: #ffffff;
            --primary: #3b82f6;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --text-dark: #1e293b;
            --text-grey: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.1), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.1), transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 60px;
        }

        /* --- 2. HERO HEADER (FULL STYLES FOR GOOGLE SITES EMBED) --- */
        .hero-card-wrapper {
            background: linear-gradient(135deg, #f0f4ff 0%, #ede9fe 40%, #eff6ff 100%);
            border-radius: 24px;
            padding: 3px;
            background-clip: padding-box;
            position: relative;
            margin-bottom: 20px;
            margin-top: 10px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.12), 0 2px 8px rgba(99, 102, 241, 0.06);
        }

        .hero-card-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, #6366f1, #3b82f6, #8b5cf6, #6366f1);
            background-size: 300% 300%;
            animation: gradientBorder 4s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-accent-stripe {
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #3b82f6, #8b5cf6, #06b6d4, #6366f1);
            background-size: 200% 100%;
            animation: stripeScroll 3s linear infinite;
            border-radius: 24px 24px 0 0;
            margin: 0 2px;
        }

        @keyframes stripeScroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .hero-dot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .dot-a { width: 8px; height: 8px; background: #6366f1; opacity: 0.25; top: 18px; left: 50%; animation: dotFloat 5s ease-in-out infinite alternate; }
        .dot-b { width: 5px; height: 5px; background: #3b82f6; opacity: 0.2; bottom: 22px; left: 35%; animation: dotFloat 7s ease-in-out infinite alternate-reverse; }
        .dot-c { width: 6px; height: 6px; background: #8b5cf6; opacity: 0.2; top: 30px; left: 30%; animation: dotFloat 6s ease-in-out infinite alternate; }

        @keyframes dotFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.3); }
        }

        .header-section-inner {
            text-align: left;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.98);
            border-radius: 22px;
            padding: 24px 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(99, 102, 241, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(99, 102, 241, 0.06) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
        }

        .header-glow-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(45px);
        }

        .orb-1 { width: 180px; height: 180px; background: rgba(99, 102, 241, 0.12); top: -60px; right: -30px; animation: driftOrb 8s ease-in-out infinite alternate; }
        .orb-2 { width: 150px; height: 150px; background: rgba(59, 130, 246, 0.10); bottom: -50px; left: -20px; animation: driftOrb 10s ease-in-out infinite alternate-reverse; }

        @keyframes driftOrb {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            100% { transform: translate(18px, 12px) scale(1.2); opacity: 1; }
        }

        .hero-text-side, .hero-visual-side { position: relative; z-index: 2; }

        .hero-text-side {
            flex: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
        }

        .badge-pulse {
            width: 7px;
            height: 7px;
            background: #6366f1;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.6);
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.4; }
        }

        .badge-float {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(59, 130, 246, 0.08));
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #4f46e5;
            letter-spacing: 0.8px;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.12);
            margin-bottom: 2px;
            animation: floatBadge 3s ease-in-out infinite;
        }

        @keyframes floatBadge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .hero-text-side h2 {
            font-size: 1.9rem;
            font-weight: 900;
            color: #1e1b4b;
            letter-spacing: -0.8px;
            line-height: 1.25;
            margin: 0;
        }

        .hero-text-side h2 span {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            margin: 0;
            line-height: 1.4;
        }

        /* CHIP PILLS */
        .hero-tech-pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0; }
        .chip-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 50px;
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.2px;
            cursor: default; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1.5px solid transparent;
        }
        .chip-icon { font-size: 0.95rem; line-height: 1; }
        .chip-label { line-height: 1; }

        .chip-blue { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.25); color: #2563eb; box-shadow: 0 2px 8px rgba(59,130,246,0.1); }
        .chip-blue:hover { background: linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border-color:transparent; transform:translateY(-2px); box-shadow:0 4px 14px rgba(59,130,246,0.3); }

        .chip-violet { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.25); color: #4f46e5; box-shadow: 0 2px 8px rgba(99,102,241,0.1); }
        .chip-violet:hover { background: linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border-color:transparent; transform:translateY(-2px); box-shadow:0 4px 14px rgba(99,102,241,0.3); }

        .chip-cyan { background: rgba(6,182,212,0.08); border-color: rgba(6,182,212,0.25); color: #0891b2; box-shadow: 0 2px 8px rgba(6,182,212,0.1); }
        .chip-cyan:hover { background: linear-gradient(135deg,#06b6d4,#0891b2); color:#fff; border-color:transparent; transform:translateY(-2px); box-shadow:0 4px 14px rgba(6,182,212,0.3); }

        /* STAT STRIP */
        .hero-stat-strip {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 6px 16px;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 50px;
            font-size: 0.75rem; color: #475569;
            box-shadow: 0 2px 10px rgba(99,102,241,0.08);
        }
        .strip-item b { color: #4f46e5; font-weight: 800; }
        .strip-sep { color: #cbd5e1; font-weight: 700; }

        /* Sisi Kanan: Holographic Circle */
        .hero-visual-side {
            flex-shrink: 0; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            padding: 10px;
            background: radial-gradient(circle at center, rgba(99,102,241,0.1) 0%, rgba(255,255,255,0.5) 60%, transparent 100%);
            border-radius: 50%;
        }

        .holo-graphic-circle {
            width: 116px; height: 116px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .holo-ring { position: absolute; border-radius: 50%; pointer-events: none; }
        .ring-1 { width: 112px; height: 112px; border: 2px solid transparent; border-top: 2.5px solid #6366f1; border-right: 2.5px solid #3b82f6; border-bottom: 2px dashed rgba(99,102,241,0.25); box-shadow: 0 0 16px rgba(99,102,241,0.22); animation: spinRing 6s linear infinite; }
        .ring-2 { width: 86px; height: 86px; border: 2px solid transparent; border-left: 2.5px solid #8b5cf6; border-bottom: 2.5px solid #3b82f6; box-shadow: 0 0 10px rgba(139,92,246,0.18); animation: spinRingReverse 4s linear infinite; }
        .ring-3 { width: 60px; height: 60px; border: 1.5px solid transparent; border-top: 2px dashed rgba(99,102,241,0.4); border-left: 2px solid rgba(59,130,246,0.35); animation: spinRing 3s linear infinite; }

        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinRingReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        .holo-core-icon {
            display: flex; align-items: center; justify-content: center; z-index: 3;
            filter: drop-shadow(0 0 8px rgba(99,102,241,0.5)) drop-shadow(0 0 20px rgba(59,130,246,0.3));
            animation: pulseCore 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseCore {
            0% { transform: scale(0.93); filter: drop-shadow(0 0 6px rgba(99,102,241,0.4)); }
            100% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(139,92,246,0.6)) drop-shadow(0 0 30px rgba(59,130,246,0.2)); }
        }

        .holo-floating-tag {
            position: absolute;
            background: rgba(255,255,255,0.92);
            border: 1.5px solid rgba(99,102,241,0.5);
            color: #4f46e5; font-size: 0.6rem; font-weight: 800;
            padding: 2px 7px; border-radius: 6px; letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(99,102,241,0.18);
            backdrop-filter: blur(6px);
        }

        .tag-top { top: -6px; right: -2px; animation: floatTag 3s ease-in-out infinite alternate; }
        .tag-bottom { bottom: -6px; left: -2px; animation: floatTag 3s ease-in-out infinite alternate-reverse; }

        @keyframes floatTag { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* Responsive header */
        @media (max-width: 480px) {
            .hero-card-wrapper { padding: 3px; border-radius: 18px; margin-bottom: 12px; }
            .header-section-inner { padding: 20px 16px; border-radius: 16px; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
            .hero-text-side { align-items: center; text-align: center; }
            .hero-text-side h2 { font-size: 1.35rem; letter-spacing: -0.3px; }
            .hero-subtitle { font-size: 0.78rem; }
            .hero-tech-pills { justify-content: center; }
            .hero-stat-strip { font-size: 0.7rem; padding: 5px 12px; }
            .badge-float { font-size: 0.65rem; padding: 3px 8px; }
            .hero-visual-side { margin-top: 4px; }
            .holo-graphic-circle { width: 90px; height: 90px; }
            .ring-1 { width: 86px; height: 86px; }
            .ring-2 { width: 66px; height: 66px; }
            .ring-3 { width: 46px; height: 46px; }
            .hero-dot { display: none; }
        }

        .chip-cyan { background: rgba(6,182,212,0.08); border-color: rgba(6,182,212,0.25); color: #0891b2; box-shadow: 0 2px 8px rgba(6,182,212,0.1); }
        .chip-cyan:hover { background: linear-gradient(135deg,#06b6d4,#0891b2); color:#fff; border-color:transparent; transform:translateY(-2px); box-shadow:0 4px 14px rgba(6,182,212,0.3); }

        /* Typing container (dipertahankan untuk efek teks) */
        .typing-container {
            font-size: 0.82rem;
            color: #4f46e5;
            font-weight: 600;
            display: block;
            min-height: 1.3em;
            max-width: 100%;
        }
        .typing-container::after {
            content: '|';
            color: #4f46e5;
            font-weight: 700;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        /* --- 3. FILTER BUTTONS --- */
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .filter-btn {
            padding: 6px 18px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-grey);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            color: var(--primary);
            background: #fff;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        /* --- 4. VIDEO CARDS --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .video-card {
            background: #fff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.1);
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
        }

        .video-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, rgba(59, 130, 246, 0.05), transparent);
            transition: 0.4s;
            z-index: 0;
        }

        .video-card:hover::before {
            height: 100%;
        }

        .thumb-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 1;
            aspect-ratio: 16/9;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
            opacity: 0.9;
        }

        .video-card:hover .thumb-wrapper img {
            transform: scale(1.05);
            opacity: 1;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s;
        }

        .play-overlay i {
            color: #fff;
            font-size: 1.2rem;
            margin-left: 3px;
        }

        .video-card:hover .play-overlay {
            background: var(--primary);
            border-color: var(--primary);
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.3);
        }

        .badge-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .card-content {
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-grey);
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .level-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .text-green {
            color: #10b981;
        }

        .text-cyan {
            color: var(--cyan);
        }

        .text-pink {
            color: var(--pink);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(90deg, var(--text-dark), #334155);
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .video-card:hover .action-btn {
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        .action-btn span.arrow {
            display: inline-block;
            transition: 0.3s;
        }

        .video-card:hover .action-btn span.arrow {
            transform: translateX(5px);
        }

        /* --- 5. MODAL PLAYER --- */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }

        .video-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .video-modal-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }

        .video-modal.active .video-modal-container {
            transform: scale(1);
        }

        /* Header Modal dengan Tombol Keluar */
        .video-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .video-title-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #f8fafc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-title-tag i {
            color: #ec4899;
            font-size: 1.2rem;
            animation: pulsePlay 2s infinite;
        }

        @keyframes pulsePlay {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        /* Tombol Keluar (Exit Video) */
        .close-video-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            flex-shrink: 0;
        }

        .close-video-btn:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        .close-video-btn i {
            font-size: 1.1rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .video-modal-footer {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }

        .close-video-btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .close-video-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .video-modal {
                padding: 12px;
            }
            .video-modal-header {
                padding: 10px 14px;
            }
            .video-title-tag {
                font-size: 0.85rem;
            }
            .close-video-btn {
                padding: 8px 14px;
                font-size: 0.82rem;
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

    </style>
</head>

<body>

    <!-- =========================================
         BAGIAN HTML (STRUKTUR)
         ========================================= -->
    <div class="container">

        <!-- Header -->
        <div class="hero-card-wrapper">
            <!-- Animated top accent stripe -->
            <div class="hero-accent-stripe"></div>

            <div class="header-section-inner">
                <!-- Background particles & orbs -->
                <div class="header-grid-lines"></div>
                <div class="header-glow-orb orb-1"></div>
                <div class="header-glow-orb orb-2"></div>

                <!-- Decorative floating dots -->
                <div class="hero-dot dot-a"></div>
                <div class="hero-dot dot-b"></div>
                <div class="hero-dot dot-c"></div>

                <!-- Sisi Kiri: Teks & Info -->
                <div class="hero-text-side">
                    <!-- Badge -->
                    <div class="badge-float">
                        <span class="badge-pulse"></span>
                        RUANG VIDEO PEMBELAJARAN
                    </div>

                    <!-- Judul Utama -->
                    <h2>Video <span>Pembelajaran</span></h2>

                    <!-- Subtitle -->
                    <p class="hero-subtitle">Koleksi video pembelajaran interaktif mencakup 3 topik utama.</p>

                    <!-- Typing Effect -->
                    <span class="typing-container" id="typewriterVideo"></span>

                    <!-- Chip Pills (3 topik video) -->
                    <div class="hero-tech-pills">
                        <div class="chip-pill chip-blue">
                            <span class="chip-icon">🖥️</span>
                            <span class="chip-label">Sistem Komputer</span>
                        </div>
                        <div class="chip-pill chip-violet">
                            <span class="chip-icon">🖱️</span>
                            <span class="chip-label">Interaksi Manusia</span>
                        </div>
                        <div class="chip-pill chip-cyan">
                            <span class="chip-icon">⚙️</span>
                            <span class="chip-label">OS &amp; Driver</span>
                        </div>
                    </div>

                    <!-- Stat Strip -->
                    <div class="hero-stat-strip">
                        <span class="strip-item">🎬 <b>9</b> Video</span>
                        <span class="strip-sep">·</span>
                        <span class="strip-item">📡 <b>YouTube</b></span>
                        <span class="strip-sep">·</span>
                        <span class="strip-item">🆓 <b>Gratis</b></span>
                    </div>
                </div>

                <!-- Sisi Kanan: Holographic Video Circle -->
                <div class="hero-visual-side">
                    <div class="holo-graphic-circle">
                        <div class="holo-ring ring-1"></div>
                        <div class="holo-ring ring-2"></div>
                        <div class="holo-ring ring-3"></div>
                        <!-- SVG Icon Video/Play -->
                        <div class="holo-core-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="46" height="46" fill="none">
                                <!-- Layar/frame video -->
                                <rect x="4" y="10" width="56" height="36" rx="5" ry="5"
                                    stroke="url(#vidGrad)" stroke-width="2.5" fill="rgba(99,102,241,0.08)"/>
                                <!-- Screen area -->
                                <rect x="10" y="16" width="44" height="24" rx="3"
                                    fill="url(#screenVid)" opacity="0.95"/>
                                <!-- Tombol play di tengah -->
                                <circle cx="32" cy="28" r="9" fill="url(#vidGrad)" opacity="0.85"/>
                                <polygon points="29,24 29,32 37,28" fill="#fff" opacity="0.95"/>
                                <!-- Pulsing ring di belakang play -->
                                <circle cx="32" cy="28" r="9" stroke="url(#vidGrad)" stroke-width="1.5" fill="none" opacity="0.4">
                                    <animate attributeName="r" values="9;14;9" dur="2s" repeatCount="indefinite"/>
                                    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
                                </circle>
                                <!-- Stand monitor -->
                                <rect x="28" y="46" width="8" height="8" rx="1" fill="url(#vidGrad)" opacity="0.75"/>
                                <rect x="20" y="54" width="24" height="4" rx="2" fill="url(#vidGrad)" opacity="0.75"/>
                                <defs>
                                    <linearGradient id="vidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#6366f1"/>
                                        <stop offset="100%" stop-color="#3b82f6"/>
                                    </linearGradient>
                                    <linearGradient id="screenVid" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="rgba(238,242,255,0.95)"/>
                                        <stop offset="100%" stop-color="rgba(219,234,254,0.8)"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <div class="holo-floating-tag tag-top">VIDEO</div>
                        <div class="holo-floating-tag tag-bottom">HD</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="controls-container">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="Sistem Komputer">Sistem Komputer</button>
            <button class="filter-btn" data-filter="Interaksi">Interaksi</button>
            <button class="filter-btn" data-filter="OS & Driver">OS & Driver</button>
        </div>

        <!-- Video Grid Container -->
        <div class="video-grid" id="videoContainer">
            <!-- Konten akan di-render oleh JavaScript -->
        </div>

    </div>

    <!-- Video Modal Overlay -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-container" id="videoModalContainer">
            <!-- Header Modal dengan Tombol Keluar Utama -->
            <div class="video-modal-header">
                <div class="video-title-tag">
                    <i class="fas fa-play-circle"></i>
                    <span id="modalVideoTitle">Menonton Video</span>
                </div>
                <button class="close-video-btn" id="closeBtn" title="Keluar dari Video">
                    <i class="fas fa-times-circle"></i> Keluar Video
                </button>
            </div>

            <!-- Frame Video Player -->
            <div class="video-wrapper">
                <iframe id="youtubeFrame" width="100%" height="100%" src="" title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
            </div>

            <!-- Footer Modal dengan Tombol Keluar Sekunder -->
            <div class="video-modal-footer">
                <button class="close-video-btn-secondary" id="closeBtnSecondary">
                    <i class="fas fa-arrow-left"></i> Tutup &amp; Kembali ke Daftar Video
                </button>
            </div>
        </div>
    </div>

    <!-- =========================================
         BAGIAN JAVASCRIPT (LOGIKA)
         ========================================= -->
    <script>
        /* --- 1. DATA VIDEO --- */
        const videos = [
            {
                id: 1,
                title: "Anatomi Komputer",
                category: "Sistem Komputer",
                level: "Mudah", levelColor: "text-green", dotColor: "#10b981",
                time: "15 Menit",
                desc: "Membedah anatomi komputer: Hardware, Software, dan Brainware secara lengkap.",
                youtubeId: "1WZaycH6awQ"
            },
            {
                id: 2,
                title: "Interaksi Manusia",
                category: "Interaksi",
                level: "Sedang", levelColor: "text-cyan", dotColor: "#06b6d4",
                time: "10 Menit",
                desc: "Bagaimana manusia 'berbicara' dengan mesin melalui Interface (GUI & CLI).",
                youtubeId: "FX-qIcq0BtI"
            },
            {
                id: 3,
                title: "Jaringan Internet",
                category: "Interaksi",
                level: "Sedang", levelColor: "text-cyan", dotColor: "#06b6d4",
                time: "12 Menit",
                desc: "Memahami konsep dasar jaringan komputer dan bagaimana data terkirim.",
                youtubeId: "YKxgEbx5Trw"
            },
            {
                id: 4,
                title: "Sistem Operasi",
                category: "OS & Driver",
                level: "Sulit", levelColor: "text-pink", dotColor: "#ec4899",
                time: "09 Menit",
                desc: "Jantung komputer yang mengatur segalanya, dari booting hingga shutdown.",
                youtubeId: "Klpmhv9ho3w"
            }
        ];

        /* --- 2. SELECTOR DOM --- */
        const container = document.getElementById('videoContainer');
        const buttons = document.querySelectorAll('.filter-btn');
        const textEl = document.getElementById('typewriterVideo');
        const modal = document.getElementById('videoModal');
        const iframe = document.getElementById('youtubeFrame');
        const closeBtn = document.getElementById('closeBtn');
        const closeBtnSecondary = document.getElementById('closeBtnSecondary');
        const modalVideoTitle = document.getElementById('modalVideoTitle');
        const videoModalContainer = document.getElementById('videoModalContainer');

        /* --- 3. EFEK MENGETIK (Typewriter) --- */
        const text = "Tonton video interaktif untuk pemahaman lebih dalam...";
        let idx = 0;

        function typeWriter() {
            if (idx < text.length) {
                textEl.innerHTML += text.charAt(idx);
                idx++; setTimeout(typeWriter, 50);
            }
        }
        // Jalankan Typewriter
        typeWriter();

        /* --- 4. RENDER VIDEO KE HTML --- */
        function renderVideos(list) {
            if (list.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--text-grey); padding:40px;">Video tidak ditemukan.</div>';
                return;
            }

            // Generate HTML String
            container.innerHTML = list.map(item => `
                <div class="video-card" onclick="openVideo('${item.youtubeId}', '${item.title.replace(/'/g, "\\'")}')">
                    <div class="thumb-wrapper">
                        <span class="badge-category">${item.category}</span>
                        <img src="https://img.youtube.com/vi/${item.youtubeId}/hqdefault.jpg" alt="${item.title}">
                        <div class="play-overlay"><i class="fas fa-play"></i></div>
                    </div>
                    
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        
                        <div class="meta-info">
                            <span class="${item.levelColor}">
                                <span class="level-dot" style="background:${item.dotColor}"></span>${item.level}
                            </span>
                            <span style="color:var(--text-grey)"><i class="far fa-clock"></i> ${item.time}</span>
                        </div>

                        <button class="action-btn">
                            Tonton Video <span class="arrow">➔</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render awal (Semua video)
        renderVideos(videos);

        /* --- 5. LOGIKA FILTER BUTTON --- */
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Hapus class active dari semua tombol
                buttons.forEach(b => b.classList.remove('active'));
                // Tambah class active ke tombol yang diklik
                btn.classList.add('active');

                const cat = btn.dataset.filter;
                // Filter data
                renderVideos(cat === 'all' ? videos : videos.filter(v => v.category === cat));
            });
        });

        /* --- 6. LOGIKA MODAL VIDEO --- */

        // Fungsi Buka Video (Dipanggil via onclick di renderVideos)
        window.openVideo = function (id, title) {
            iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            if (title && modalVideoTitle) {
                modalVideoTitle.textContent = title;
            }
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Posisi otomatis ke tengah viewport agar tidak perlu scroll manual
            setTimeout(() => {
                modal.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        };

        // Fungsi Tutup Video
        function closeVideo() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            // Hapus src agar suara video berhenti
            setTimeout(() => { iframe.src = ""; }, 300);
        }

        // Event Listener: Klik tombol close utama dan sekunder
        if (closeBtn) closeBtn.addEventListener('click', closeVideo);
        if (closeBtnSecondary) closeBtnSecondary.addEventListener('click', closeVideo);

        // Event Listener: Tombol ESC untuk keluar video
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeVideo();
            }
        });

        // Event Listener: Klik area luar modal (background) untuk menutup
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeVideo();
            }
        });

        // Mencegah penutupan jika area video container diklik
        if (videoModalContainer) {
            videoModalContainer.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

    </script>

</body>

</html>
