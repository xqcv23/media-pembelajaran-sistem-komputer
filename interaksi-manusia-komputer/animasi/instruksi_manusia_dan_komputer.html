<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HCI Simulator - Mobile Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --neon-orange: #f59e0b;
            --neon-purple: #d946ef;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            color: #f8fafc;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px;
            overflow-x: hidden;
        }

        h1 { 
            font-size: 1rem; text-align: center; margin: 10px 0;
            text-transform: uppercase; letter-spacing: 3px;
            color: #fff; text-shadow: 0 0 10px var(--neon-blue);
        }

        /* --- CONTROLS (Border Removed) --- */
        .controls {
            z-index: 100; background: transparent; 
            padding: 10px; border: none; /* Garis pembungkus dihilangkan */
            display: flex; gap: 8px; margin-bottom: 20px;
        }
        input { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-blue); color: white; padding: 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; outline: none; width: 130px; font-size: 0.75rem; }
        button { background: var(--neon-blue); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        button:disabled { opacity: 0.4; }

        /* --- SCENE --- */
        .scene { perspective: 1000px; width: 100%; display: flex; justify-content: center; }
        .diagram-container {
            transform: rotateX(15deg); transform-style: preserve-3d;
            display: grid; 
            grid-template-columns: 120px 45px 120px 45px 120px;
            grid-template-rows: 90px 50px 90px; gap: 0; align-items: center; justify-items: center;
            position: relative; width: 450px;
        }

        /* --- BOXES --- */
        .box {
            width: 100%; height: 100%; background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.5s; position: relative; z-index: 10;
        }
        .box i { font-size: 1.5rem; margin-bottom: 5px; font-style: normal; position: relative; z-index: 20; }
        .box h3 { font-size: 0.6rem; margin: 0; letter-spacing: 1.5px; color: #94a3b8; text-transform: uppercase; position: relative; z-index: 20; }
        .box-input { border-bottom: 3px solid var(--neon-blue); }
        .box-cpu { border-bottom: 3px solid var(--neon-red); }
        .box-storage { border-bottom: 3px solid var(--neon-orange); }
        .box.active { transform: translateZ(30px) scale(1.05); border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.2); }

        /* --- CORE --- */
        .quantum-core { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; opacity: 0.1; mix-blend-mode: screen; z-index: 1; }
        .box-storage.active .quantum-core { opacity: 0.7; }
        .core-center { width: 25px; height: 25px; background: var(--neon-orange); border-radius: 50%; box-shadow: 0 0 20px var(--neon-orange); }
        .core-ring { position: absolute; border: 1px solid var(--neon-orange); border-radius: 50%; animation: orbit 3s infinite linear; }
        .ring-1 { width: 45px; height: 45px; }
        @keyframes orbit { from { transform: rotate(0deg) rotateX(60deg); } to { transform: rotate(360deg) rotateX(60deg); } }

        /* --- PIPES & PARTICLES --- */
        .pipe-h { width: 100%; height: 2px; background: rgba(255,255,255,0.05); }
        .pipe-v { height: 100%; width: 2px; background: rgba(255,255,255,0.05); }
        .particle { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff, 0 0 15px var(--neon-blue); opacity: 0; z-index: 100; transform: translate(-3px, -3px); }

        /* --- MONITOR --- */
        .monitor-frame { width: 85%; height: 45px; background: #000; border: 1px solid #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .monitor-screen { width: 100%; height: 100%; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--neon-green); text-align: center; overflow: hidden; }

        /* --- FEEDBACK --- */
        .feedback-line { position: absolute; top: 45px; left: 60px; width: 330px; height: 200px; border: 1.5px dashed rgba(255, 255, 255, 0.15); border-top: none; border-radius: 0 0 40px 40px; pointer-events: none; }

        /* --- LOG (Compact & Limited Line) --- */
        .log-container {
            margin-top: 25px; width: 95%; max-width: 450px; height: 90px;
            background: rgba(0,0,0,0.6); border-left: 3px solid var(--neon-blue); /* Garis biru dibuat lebih tipis & pendek sesuai box */
            padding: 10px; border-radius: 4px; overflow-y: auto;
            font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
        }
        .log-entry { margin-bottom: 3px; color: #4b5563; }
        .log-info { color: var(--neon-blue); }
        .log-proc { color: var(--neon-red); }
        .log-store { color: var(--neon-orange); }

        @keyframes flowRight { 0% { left: 0; opacity: 1; } 100% { left: 100%; opacity: 1; } }
        @keyframes flowDown { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 1; } }
        @keyframes flowUp { 0% { top: 100%; opacity: 1; } 100% { top: 0; opacity: 1; } }
        @keyframes flowFB {
            0% { top: 45px; left: 390px; opacity: 0; }
            5% { opacity: 1; }
            35% { top: 245px; left: 390px; }
            65% { top: 245px; left: 60px; }
            100% { top: 45px; left: 60px; opacity: 0; }
        }

        /* --- MOBILE FIX --- */
        @media (max-width: 600px) {
            h1 { font-size: 0.9rem; }
            .controls { gap: 5px; transform: scale(0.9); margin-bottom: 10px; }
            input { width: 100px; }
            .scene { transform: scale(0.65); margin-top: -30px; } /* Diperkecil supaya muat di layar potret HP */
            .log-container { width: 90%; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <h1>HCI Ultimate Hub</h1>

    <div class="controls">
        <input type="text" id="userInput" placeholder="INJECT DATA..." autocomplete="off">
        <button id="btnRun" onclick="runSystem()">Run</button>
        <button onclick="location.reload()" style="background:#334155;">Reset</button>
    </div>

    <div class="scene">
        <div class="diagram-container">
            <div class="box box-input" id="bInput"><i>⌨️</i><h3>INPUT</h3></div>
            <div class="pipe-h" id="p1"></div>
            <div class="box box-cpu" id="bCpu"><i>⚙️</i><h3>CPU</h3></div>
            <div class="pipe-h" id="p2"></div>
            <div class="box box-output" id="bOut">
                <div class="monitor-frame"><div class="monitor-screen" id="screenText"></div></div>
                <h3>OUTPUT</h3>
            </div>

            <div></div><div></div><div class="pipe-v" id="p3"></div><div></div><div></div>

            <div></div><div></div>
            <div class="box box-storage" id="bStore">
                <div class="quantum-core"><div class="core-center"></div><div class="core-ring ring-1"></div></div>
                <i>💾</i><h3>STORAGE</h3>
            </div>
            <div></div><div></div>

            <div class="feedback-line"></div>
            <div id="pLayer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; transform-style:preserve-3d;"></div>
        </div>
    </div>

    <div class="log-container" id="log">
        <div class="log-entry">// Sistem Standby...</div>
    </div>

    <script>
        const log = document.getElementById('log');
        const btn = document.getElementById('btnRun');
        const input = document.getElementById('userInput');
        const screen = document.getElementById('screenText');
        const pLayer = document.getElementById('pLayer');

        const boxes = {
            in: document.getElementById('bInput'),
            cpu: document.getElementById('bCpu'),
            out: document.getElementById('bOut'),
            store: document.getElementById('bStore')
        };

        const pipes = { p1: document.getElementById('p1'), p2: document.getElementById('p2'), p3: document.getElementById('p3') };

        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.innerHTML = `> ${msg}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function spawnParticles(pipe, direction, color) {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.boxShadow = `0 0 10px #fff, 0 0 15px ${color}`;
                    if (direction === 'right') p.style.animation = 'flowRight 0.7s linear forwards';
                    else if (direction === 'down') p.style.animation = 'flowDown 0.7s linear forwards';
                    else if (direction === 'up') p.style.animation = 'flowUp 0.7s linear forwards';
                    pipe.appendChild(p);
                    setTimeout(() => p.remove(), 800);
                }, i * 130);
            }
        }

        async function runSystem() {
            const val = input.value;
            if (!val) return;
            btn.disabled = true;
            log.innerHTML = ''; screen.innerText = '';
            
            addLog(`KONEKSI NEURAL AKTIF: "${val}"`, 'info');
            boxes.in.classList.add('active');
            await new Promise(r => setTimeout(r, 800));
            spawnParticles(pipes.p1, 'right', 'var(--neon-blue)');
            await new Promise(r => setTimeout(r, 700));
            boxes.in.classList.remove('active');

            addLog(`INTI PROSESOR: ANALISIS DATA...`, 'proc');
            boxes.cpu.classList.add('active');
            await new Promise(r => setTimeout(r, 1000));

            addLog(`INTI KUANTUM: MENYIMPAN DATA...`, 'store');
            spawnParticles(pipes.p3, 'down', 'var(--neon-orange)');
            await new Promise(r => setTimeout(r, 600));
            boxes.store.classList.add('active');
            await new Promise(r => setTimeout(r, 1200));
            
            addLog(`INTI KUANTUM: MEMBACA DATA...`, 'store');
            spawnParticles(pipes.p3, 'up', 'var(--neon-blue)');
            await new Promise(r => setTimeout(r, 600));
            boxes.store.classList.remove('active');
            
            addLog(`DISPLAY: MERENDER VISUAL...`, 'out');
            spawnParticles(pipes.p2, 'right', 'var(--neon-green)');
            await new Promise(r => setTimeout(r, 700));
            boxes.cpu.classList.remove('active');
            boxes.out.classList.add('active');

            for (let char of val) {
                screen.innerText += char;
                await new Promise(r => setTimeout(r, 80));
            }
            await new Promise(r => setTimeout(r, 1200));

            addLog(`SINKRONISASI FEEDBACK...`, 'info');
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.animation = 'flowFB 1.6s linear forwards';
                    pLayer.appendChild(p);
                    setTimeout(() => p.remove(), 1800);
                }, i * 200);
            }
            await new Promise(r => setTimeout(r, 1800));
            
            boxes.in.classList.add('active');
            addLog(`SIKLUS SELESAI.`, 'info');
            await new Promise(r => setTimeout(r, 800));
            boxes.in.classList.remove('active');
            boxes.out.classList.remove('active');
            btn.disabled = false;
        }
    </script>
</body>
</html>
